name: Build Chest Count Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - chest-count
    paths:
      - 'chest-count-android/**'
      - '.github/workflows/chest-count-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: chest-count-android
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Chest-Count-debug-apk
          path: chest-count-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
